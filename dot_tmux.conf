set -s extended-keys on
set -g extended-keys-format csi-u

# True color support
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:RGB"
set -sa terminal-overrides ",xterm-kitty:RGB"
set -as terminal-features ",xterm-kitty:clipboard"

# Allow kitty escape sequences to pass through tmux
set -g allow-passthrough on

# Enable focus events (used by nvim autocommands)
set -g focus-events on

# Make Escape and Alt-key sequences respond immediately.
set -s escape-time 0

# Forward application clipboard writes to the local terminal through OSC 52.
set -s set-clipboard on
set -s copy-command 'wl-copy'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'erikw/tmux-powerline'

# Open opencode in a left split
bind-key o split-window -hb 'opencode' \; select-pane -t 1

# Keep standard splits and new windows in the active pane's directory.
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key '%' split-window -h -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'

# Pass display/session/auth env vars from the attaching client
set-option -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_RUNTIME_DIR XDG_CURRENT_DESKTOP"

# Enable mouse support
set -g mouse on

# Name windows after the active pane's working directory, not the running app.
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off

# Show each pane's working directory in its border.
set -g pane-border-status top
set -g pane-border-format ' #{b:pane_current_path} '

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
