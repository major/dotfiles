[settings]
# Keep downloads out of ordinary command execution.
auto_install = false

[tools]
# Language runtimes
bun = "1.4.4"
go = "1.25.6"

# Backup
restic = "0.19.1"
"github:creativeprojects/resticprofile" = "0.33.1"

# Kubernetes and GitOps
flux2 = "2.9.6"
kubectl = "1.37.1"
kubeseal = "0.41.1"
kustomize = "5.8.3"
helm = "4.3.1"
k9s = "0.51.0"
stern = "1.35.0"
kubeswitch = "0.9.3"

# Source hosting
github-cli = "2.103.2"
glab = "1.124.0"

# Infrastructure and releases
terraform = "1.17.0"
goreleaser = "2.19.0"
golangci-lint = "2.15.0"
oras = "1.3.6"

# Encryption: age also provides age-keygen.
age = "1.3.2"
sops = "3.13.3"

# Terminal tools
lazygit = "0.66.2"
herdr = "0.9.5"

# Site generation and photo uploads
hugo-extended = "0.168.0"
"github:simulot/immich-go" = "1.21.3"

# Tools without registry shorthands
"github:ankitpokhrel/jira-cli" = "1.7.0"

# The registry's ant package is Apache Ant, not the Anthropic CLI.
[tools."github:anthropics/anthropic-cli"]
version = "2.3.0"
asset_pattern = "ant_{{ version }}_linux_amd64.tar.gz"
filter_bins = ["ant"]

[tools."http:coderabbit"]
# renovate: datasource=custom.coderabbit-cli depName=coderabbit-cli
version = "0.9.1"
url = "https://cli.coderabbit.ai/releases/{{ version }}/coderabbit-linux-x64.zip"
rename_exe = "coderabbit"

[tools.oc]
version = "4.22.18"
platforms.linux-x64.url = "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux-amd64-rhel9.tar.gz"
# Expose only oc, not the archive's bundled kubectl.
bin_path = "bin"
postinstall = '''
mkdir -p "$MISE_TOOL_INSTALL_PATH/bin"
ln -sf ../oc "$MISE_TOOL_INSTALL_PATH/bin/oc"
'''
