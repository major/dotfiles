<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Prefer Fedora's packaged color emoji font. -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Alacritty 0.17 cannot rasterize Fedora's COLRv1 emoji font. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/Noto-COLRv1.ttf</glob>
    </rejectfont>
  </selectfont>

  <!-- Let color emoji handle emoji-capable symbols in the text font. -->
  <match target="scan">
    <test name="family" compare="contains">
      <string>JetBrains Mono</string>
    </test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x2600</int><int>0x27BF</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <!-- Keep the primary font's metrics and use ordered glyph fallbacks. -->
  <match target="pattern">
    <test qual="any" name="family"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Symbols Nerd Font Mono</string>
    </edit>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
